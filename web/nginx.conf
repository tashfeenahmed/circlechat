server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Brotli: NOT available on this image. `nginx:alpine` is built from source
    # without ngx_brotli and ships no brotli module in /usr/lib/nginx/modules
    # (checked against the running container: `nginx -V` lists
    # --with-http_gzip_static_module and nothing brotli-shaped, and the modules
    # directory holds only acme/geoip/image_filter/js/xslt). Enabling it would
    # mean maintaining a custom nginx image, which is a bigger change than this
    # earns — so gzip stays, and we make it do more work instead.
    #
    # `gzip_static` serves the .gz files the build writes next to each asset,
    # compressed once at level 9, rather than re-compressing the same bundle on
    # every request at nginx's default level. Declared at server level so it
    # can't collide with a `gzip` directive in a future base image's http block.
    gzip_static on;

    # On-the-fly gzip for anything without a .gz sibling. The stock image ships
    # with `gzip` commented out and a text/html-only default type list, so both
    # are stated explicitly here.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/markdown
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # ── 404s that used to be 200s ──
    #
    # `try_files $uri /index.html` is the right rule for a client-side router
    # and the wrong one for everything else: live.circlechat.co answered
    # /metrics, /.env and /wp-login.php with the SPA shell and a 200, which
    # tells a scanner every path it probes exists and puts 6 KB of HTML behind
    # each one. Three narrow exceptions, conservative on purpose:
    #   • the handful of paths that are only ever a probe;
    #   • dotfiles that would be a secret if they existed;
    #   • any request whose LAST segment carries an extension — that is a file
    #     request, so serve the file or 404, never hand back index.html.
    # A client route ("/board", "/goals", "/doesnotexist") has no dot in its
    # last segment and still renders the SPA, which is what the router is for.
    #
    # Location precedence matters here: `=` beats `^~` beats regex (in file
    # order) beats a plain prefix. So the exact matches come first, `^~
    # /assets/` keeps hashed bundles out of the extension regex below, and the
    # regex block sits above the catch-all `location /`.
    location = /metrics {
        return 404;
    }
    location = /metrics/ {
        return 404;
    }
    # The SPA entry keeps its no-cache header even when asked for by name —
    # without this exact match it would fall into the extension regex below.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ^~ /assets/ {
        # ONE cache-control header. `expires 30d` emits its own
        # `Cache-Control: max-age=2592000` (plus an `Expires:` date), so having
        # it alongside the add_header below meant every asset response carried
        # two conflicting Cache-Control lines — the weaker one first, and no
        # `immutable`. The add_header is the one we want, so the expires
        # directive is gone.
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    location ~ ^/\.(?:env|git|svn|ht|aws|ssh|docker) {
        return 404;
    }
    location ~ ^/wp[-/] {
        return 404;
    }
    location ~ "^/.*\.[A-Za-z0-9]{1,8}$" {
        try_files $uri =404;
    }

    # The SPA entry must never be cached: asset filenames are content-hashed
    # and change every deploy, so a heuristically-cached index.html points at
    # purged bundles → blank page until a hard refresh. no-cache still allows
    # etag revalidation (cheap 304s), it just forbids serving stale copies.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
