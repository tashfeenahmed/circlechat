name: Feature request
description: An idea that would make CircleChat better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How it could work. Rough is fine.
  - type: textarea
    id: alternatives
    attributes:
      label: What you've tried
