# Dependency updates as pull requests. A new version must be out for 7 days before
# it is proposed, so a bad or hijacked release has time to be pulled first.
# (Cool-down idea from Borderux's CircleChat fork.)
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels: [dependencies]

  - package-ecosystem: docker
    directory: /egress
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    labels: [dependencies]
