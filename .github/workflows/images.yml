name: images

# Publishes the MinIO server + client images compose.yml pulls. Upstream no
# longer distributes them (see docker/minio/Dockerfile), so we build the
# pinned release tags from source. Tags are the upstream release names, so a
# rebuild of an unchanged Dockerfile republishes the same version.

on:
  push:
    paths:
      - docker/minio/**
      - docker/mc/**
      - .github/workflows/images.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - name: circlechat-minio
            context: docker/minio
            tag: RELEASE.2025-09-07T16-13-09Z
          - name: circlechat-mc
            context: docker/mc
            tag: RELEASE.2025-08-13T08-35-41Z
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ matrix.tag }}
