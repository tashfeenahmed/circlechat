<!doctype html><html><head><meta charset="utf-8"><title>CircleChat</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{margin:0;height:100vh;display:grid;place-items:center;background:#F4F5F8;font:15px/1.5 Geist,system-ui,sans-serif;color:#17181F}
.card{background:#fff;border-radius:22px;padding:32px;width:380px;box-shadow:0 18px 40px -18px rgba(20,22,40,.28)}
h1{font-size:24px;margin:0 0 4px;letter-spacing:-.02em}p{color:#6E7183;margin:0 0 20px}
input{width:100%;box-sizing:border-box;height:48px;border-radius:14px;border:1.5px solid #E4E6EC;padding:0 14px;font:inherit}
button{margin-top:12px;width:100%;height:48px;border:0;border-radius:99px;background:#17181F;color:#fff;font:inherit;font-weight:600;cursor:pointer}
.err{color:#D33A42;font-size:13px;min-height:20px;margin-top:8px}</style></head>
<body><form class="card" id="f"><h1>Connect to your server</h1><p>The address of your CircleChat, for example chat.yourteam.com</p>
<input id="u" placeholder="https://chat.yourteam.com" autofocus><button>Connect</button><div class="err" id="e"></div></form>
<script>
document.getElementById("f").onsubmit=async(ev)=>{ev.preventDefault();let v=document.getElementById("u").value.trim();if(!/^https?:\/\//.test(v))v="https://"+v;
try{const r=await fetch(v+"/healthz");if(!r.ok)throw new Error();await window.circlechatDesktop.setServer(v)}catch(e){document.getElementById("e").textContent="Couldn't reach CircleChat at that address."}};
</script></body></html>
